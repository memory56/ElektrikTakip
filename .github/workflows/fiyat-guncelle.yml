name: PTF fiyatlarını güncelle

on:
  schedule:
    - cron: "17 6 * * *"   # her gün 09:17 (TSİ)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repo-yazma
  cancel-in-progress: false

jobs:
  guncelle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: pdftotext kur
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - name: Bülteni oku, prices.json güncelle
        # EPİAŞ sitesi ara sıra geçici olarak yanıt vermiyor: 3 deneme, aralarında 5 dk
        run: |
          for i in 1 2 3; do python3 scripts/fiyat_guncelle.py && exit 0; [ $i -lt 3 ] && { echo "Tekrar denenecek ($i)"; sleep 300; }; done
          exit 1
      - name: Değişiklik varsa kaydet
        run: |
          if git diff --quiet -- prices.json; then echo "Değişiklik yok"; exit 0; fi
          git config user.name "fiyat-botu"
          git config user.email "actions@users.noreply.github.com"
          git add prices.json
          git commit -m "PTF fiyatları güncellendi ($(date +%F))"
          git pull --rebase -q && git push
